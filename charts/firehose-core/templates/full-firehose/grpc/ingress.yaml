{{- $values := $.Values.fullMode.components.grpc }}
{{- if and $values.enabled $values.ingress.enabled (ne .Values.mode "full") }}
{{- fail "fullMode.components.grpc.ingress.enabled requires mode=full; disable this full-mode ingress or use mode=full" }}
{{- end }}
{{- $componentName := "grpc" }}
{{- $componentLabel := include "firehose-ethereum.componentLabelFor" $componentName }}
{{- if and $values.enabled (default false $values.ingress.enabled) (ne (default "" $values.ingress.host) "") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-firehose-{{ $componentName }}-ingress
  labels:
    {{- include "firehose-ethereum.labels" . | nindent 4 }}
    {{- $componentLabel | nindent 4 }}
  annotations:
    {{- with $values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-firehose-{{ $componentName }}-svc
                port:
                  name: grpc
  tls:
    - hosts:
        - {{ $values.ingress.host }}
      secretName: {{ printf "%s-firehose-%s-tls" .Release.Name $componentName }}
{{- end }}