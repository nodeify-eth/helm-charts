{{- include "firehose-core.jwt.resolve" . }}
{{- $jwt := index . "_firehose-core_jwt" }}
{{- if and $jwt.active (not $jwt.external) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $jwt.name | quote }}
  labels:
    {{- include "firehose-ethereum.labels" . | nindent 4 }}
    {{- include "firehose-ethereum.componentLabelFor" "reader" | nindent 4 }}
type: Opaque
data:
  jwt.hex: {{ $jwt.encoded | quote }}
{{- end }}
