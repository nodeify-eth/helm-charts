name: Helm Chart Management
on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'charts/**'

permissions:
  contents: read

jobs:
  bump-version:
    name: Bump Chart Version
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    concurrency:
      group: chart-bump-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for appVersion changes
        id: check-changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_COMMIT=$(git merge-base "origin/$BASE_REF" HEAD)
          CHANGED_CHARTS=$(git diff --name-only --diff-filter=AM "$BASE_COMMIT" -- 'charts/*/Chart.yaml')
          if [ -n "$CHANGED_CHARTS" ]; then
            {
              echo 'changed_charts<<CHART_PATHS'
              echo "$CHANGED_CHARTS"
              echo 'CHART_PATHS'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Bump chart versions
        if: steps.check-changes.outputs.changed_charts != ''
        env:
          BASE_REF: ${{ github.base_ref }}
          CHANGED_CHARTS: ${{ steps.check-changes.outputs.changed_charts }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_COMMIT=$(git merge-base "origin/$BASE_REF" HEAD)

          while IFS= read -r chart_yaml; do
            # New charts already declare their initial version.
            if ! base_chart=$(git show "$BASE_COMMIT:$chart_yaml" 2>/dev/null); then
              continue
            fi
            base_version=$(echo "$base_chart" | grep '^version:')
            current_version_line=$(grep '^version:' "$chart_yaml")
            if [ "$base_version" != "$current_version_line" ]; then
              echo "Chart version already changed in $chart_yaml"
              continue
            fi
            if git diff "$BASE_COMMIT" -- "$chart_yaml" | grep -qE '^[+-]appVersion:'; then
              echo "Bumping version in $chart_yaml"
              
              # Get current version
              current_version=$(grep "^version:" "$chart_yaml" | sed 's/version: //' | tr -d '"' | tr -d "'")
              if ! [[ "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "Manually bump chart version for prerelease, build metadata, or invalid version: $chart_yaml" >&2
                exit 1
              fi
              
              # Split into components
              IFS='.' read -r major minor patch <<< "$current_version"
              
              # Increment patch version
              new_patch=$((patch + 1))
              new_version="$major.$minor.$new_patch"
              
              # Update version in file
              NEW_VERSION="$new_version" perl -pi -e 's/^version: .*/version: $ENV{NEW_VERSION}/' "$chart_yaml"
              
              git add "$chart_yaml"
            fi
          done <<< "$CHANGED_CHARTS"
          
          if git diff --staged --quiet; then
            echo "No chart versions to bump"
          else
            echo "Chart version candidate staged; live PR checks and version validation must pass before push"
          fi

      - name: Set up Python for candidate validation
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install candidate validation dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Validate and publish candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python .github/scripts/chart_pr_automation.py publish-bump

  release:
    name: Release Charts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.17.0'

      - name: Add Helm repositories
        run: |
          helm repo add stable https://charts.helm.sh/stable

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"
