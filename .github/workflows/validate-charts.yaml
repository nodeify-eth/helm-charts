name: Validate Charts

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Tool versions for both CI and the local checks in CONTRIBUTING.md.
env:
  PYTHON_VERSION: '3.12'
  HELM_VERSION: 'v3.17.0'

jobs:
  validate:
    name: Validate Charts
    runs-on: ubuntu-26.04
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Confirm current PR snapshot
        id: snapshot
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python .github/scripts/chart_pr_automation.py validate-snapshot

      - name: Check changed chart versions
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          .venv/bin/python .github/scripts/check_chart_versions.py \
            --base-ref "refs/remotes/origin/$BASE_REF" --head-ref "$HEAD_SHA"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check regression prerequisites
        run: |
          for tool in sh jq sha256sum; do
            command -v "$tool" || exit 1
          done

      - name: Run regression tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Lint all charts
        shell: bash
        run: |
          for chart in charts/*/Chart.yaml; do
            helm lint "${chart%/Chart.yaml}" || exit 1
          done

      - name: Confirm PR snapshot is still current
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ steps.snapshot.outputs.base_sha }}
        run: .venv/bin/python .github/scripts/chart_pr_automation.py validate-snapshot
