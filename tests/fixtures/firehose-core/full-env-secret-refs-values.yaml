s3CredentialsSecret: fixture-s3
fullMode:
  components:
    grpc:
      extraEnvs:
      - name: FIXTURE_LITERAL
        value: fixture
      - name: FIXTURE_FROM_CONFIG
        valueFrom:
          configMapKeyRef:
            name: fixture-env-config
            key: value
      - name: FIXTURE_FROM_SECRET
        valueFrom:
          secretKeyRef:
            name: fixture-env-secret
            key: value
